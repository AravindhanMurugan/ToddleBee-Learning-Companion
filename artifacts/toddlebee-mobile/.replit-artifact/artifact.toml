kind = "mobile"
previewPath = "/toddlebee-mobile/"
title = "ToddleBee Mobile"
description = "A native Android and iOS learning companion for ToddleBee children and parents, with English and Tamil lessons, supportive fraction practice, progress tracking, and parent controls."
version = "1.0.0"
id = "artifacts/toddlebee-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/toddlebee-mobile/" ]
localPort = 18730

[services.development]
run = "pnpm --filter @workspace/toddlebee-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/toddlebee-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/toddlebee-mobile", "run", "serve" ]

[services.env]
PORT = "18730"
BASE_PATH = "/toddlebee-mobile/"
